# docker-compose.yml：只打包应用层（FastAPI 后端 + Streamlit 前端 + Prometheus + Grafana）
# 外部依赖需先启动（全部就绪后再 up 本项目）：
#   1. PostgreSQL（本机服务，含 pgvector 扩展，监听 5432）
#   2. Redis（本机 redis74 容器，映射 6379）
#   3. Milvus：cd milvus && docker-compose up -d（创建外部网络 milvus）
# backend 通过 host.docker.internal 访问宿主机上的 PostgreSQL/Redis，通过外部网络 milvus 直达 Milvus
services:
  # ---- FastAPI 后端 ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - USER_AGENT=RAG-EndToEnd-API/1.0
      # 外部依赖：PostgreSQL/Redis 走宿主机（host.docker.internal），Milvus 走外部网络服务名
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - DB_URI=postgresql://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable
      - REDIS_URL=redis://host.docker.internal:6379/0
      # MinerU 模型缓存路径（挂载本机已有缓存，避免容器内重复下载）
      - MODELSCOPE_CACHE=/models/modelscope
    volumes:
      # 挂载本机 MinerU/ModelScope 模型缓存
      - E:\MODELSCOPE_HUB\.cache\modelscope:/models/modelscope
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - default
      - milvus          # 加入 Milvus 所在的外部网络
    extra_hosts:
      # 保证 host.docker.internal 可解析到宿主机（Linux 引擎下也生效）
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Streamlit 前端 ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000   # 容器间通过服务名通信
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

  # ---- Prometheus（指标采集存储，每 15s 抓后端 /metrics）----
  # 单独起监控（后端在宿主机 python main.py 运行）：docker-compose up -d prometheus grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Linux 引擎下也能解析 host.docker.internal（抓宿主机上直接跑的后端）
      - "host.docker.internal:host-gateway"

  # ---- Grafana（可视化大盘，自动装配数据源和仪表盘）----
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      # 本地开发免登录，直接以管理员身份进入
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# Milvus 部署创建的外部网络，必须先启动 Milvus（cd milvus && docker-compose up -d）
networks:
  milvus:
    external: true
    name: milvus

volumes:
  prometheus_data:
  grafana_data:
