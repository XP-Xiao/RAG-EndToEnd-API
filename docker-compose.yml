# docker-compose.yml：同时启动 FastAPI 后端 + Streamlit 前端
# 需要先启动 Milvus：cd milvus && docker-compose up -d
services:
  # ---- FastAPI 后端 ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - USER_AGENT=RAG-EndToEnd-API/1.0
      # Docker 环境下覆盖 .env 中的 localhost，改用 Milvus 服务名
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      # MinerU 模型缓存路径（挂载本机已有缓存，避免容器内重复下载）
      - MODELSCOPE_CACHE=/models/modelscope
    volumes:
      # 挂载本机 MinerU/ModelScope 模型缓存
      - E:\MODELSCOPE_HUB\.cache\modelscope:/models/modelscope
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - default
      - milvus          # 加入 Milvus 所在的外部网络
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Streamlit 前端 ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000   # 容器间通过服务名通信
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

# Milvus 部署创建的外部网络，必须先启动 Milvus（cd milvus && docker-compose up -d）
networks:
  milvus:
    external: true
    name: milvus
