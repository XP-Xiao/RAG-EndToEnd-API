# docker-compose.yml：同时启动 FastAPI 后端 + Streamlit 前端 + PostgreSQL（长短期记忆）+ Redis（缓存）
# 需要先启动 Milvus：cd milvus && docker-compose up -d
services:
  # ---- PostgreSQL（含 pgvector，Agent 长短期记忆）----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Redis（LLM/答案缓存）----
  redis:
    image: redis:8
    container_name: rag-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- FastAPI 后端 ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - USER_AGENT=RAG-EndToEnd-API/1.0
      # Docker 环境下覆盖 .env 中的 localhost，改用各服务名
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - DB_URI=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      # MinerU 模型缓存路径（挂载本机已有缓存，避免容器内重复下载）
      - MODELSCOPE_CACHE=/models/modelscope
    volumes:
      # 挂载本机 MinerU/ModelScope 模型缓存
      - E:\MODELSCOPE_HUB\.cache\modelscope:/models/modelscope
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - milvus          # 加入 Milvus 所在的外部网络
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Streamlit 前端 ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000   # 容器间通过服务名通信
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

# Milvus 部署创建的外部网络，必须先启动 Milvus（cd milvus && docker-compose up -d）
networks:
  milvus:
    external: true
    name: milvus

volumes:
  pg_data:
  redis_data:
